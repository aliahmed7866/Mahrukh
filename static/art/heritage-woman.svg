<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title description">
<title id="title">A woman in an emerald kameez, trousers and dupatta</title>
<desc id="description">Original decorative fashion illustration. A woman in a flowing emerald kameez and ivory trousers gently gathers a sage dupatta. Fine botanical lines sit against warm ivory.</desc>
