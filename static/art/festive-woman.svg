<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title description">
<title id="title">A woman in a ruby festive outfit and rose dupatta</title>
<desc id="description">Original decorative fashion illustration. A woman turns gently in a full ruby outfit, holding a rose dupatta over one arm. Restrained gold details and a botanical branch complement the warm background.</desc>
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f0e7df"/><stop offset="1" stop-color="#e9dfd0"/></linearGradient>
 <radialGradient id="wash"><stop stop-color="#e4cec5" stop-opacity=".8"/><stop offset="1" stop-color="#e4cec5" stop-opacity="0"/></radialGradient>
 <linearGradient id="emerald" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#163e37"/><stop offset=".45" stop-color="#346c5b"/><stop offset="1" stop-color="#204f44"/></linearGradient>
 <linearGradient id="ruby" x1="0" y1="0" x2="1" y2=".35"><stop stop-color="#673441"/><stop offset=".48" stop-color="#a85b64"/><stop offset="1" stop-color="#763b49"/></linearGradient>
 <linearGradient id="silk" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#c99a8e"/><stop offset=".5" stop-color="#dfb7a6"/><stop offset="1" stop-color="#ac766f"/></linearGradient>
 <linearGradient id="sage" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#91a28b"/><stop offset=".6" stop-color="#bec7aa"/><stop offset="1" stop-color="#7d9480"/></linearGradient>
