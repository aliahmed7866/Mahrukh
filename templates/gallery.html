<div class="detail-image"><a href="{{ item.images[0] }}" target="_blank" rel="noopener noreferrer" data-open-gallery aria-label="Enlarge photo of {{ item.name }}"><img id="main-product-image" src="{{ item.images[0] }}" alt="{{ 'AI-generated concept: ' if demo|default(false) else '' }}{{ item.name }}" fetchpriority="high"><span class="enlarge-photo">View the details {{ icon('search') }}</span></a></div>
{% if item.images|length > 1 %}<div class="thumbnails">{% for src in item.images %}<button class="thumbnail" type="button" data-image="{{ src }}" data-image-index="{{ loop.index0 }}" aria-label="View image {{ loop.index }}" aria-pressed="{{ 'true' if loop.first else 'false' }}"><img src="{{ src }}" alt="{{ item.name }}, view {{ loop.index }}"></button>{% endfor %}</div>{% endif %}
<dialog class="photo-dialog" id="photo-dialog" aria-labelledby="photo-title"><div class="photo-toolbar"><h2 id="photo-title">{{ item.name }}</h2><button type="button" class="photo-close" data-close-photo aria-label="Close enlarged photo">✕</button></div><div class="photo-stage"><img data-large-photo src="{{ item.images[0] }}" alt="{{ 'AI-generated concept: ' if demo|default(false) else '' }}{{ item.name }}"></div><div class="photo-footer"><button type="button" class="text-button" data-photo-prev {% if item.images|length < 2 %}hidden{% endif %}>← Previous</button><p data-photo-count aria-live="polite">Photo 1 of {{ item.images|length }}</p><button type="button" class="text-button" data-photo-next {% if item.images|length < 2 %}hidden{% endif %}>Next →</button></div>{% if demo|default(false) %}<p class="caption">AI-generated concept photograph · Not an actual product.</p>{% endif %}</dialog>
