{% if demo|default(false) %}<button type="button" class="save-piece" data-demo-save="{{ p.id }}" data-piece-name="{{ localized(p,'name') }}" aria-label="{{ t('Save {name}',name=localized(p,'name')) }}" aria-pressed="false">{{ icon('heart') }}<span class="save-label">{{ t("Save") }}</span></button>{% else %}<form action="{{ url_for('save_piece',pid=p.id) }}" method="post" data-save-form data-piece-id="{{ p.id }}" data-piece-name="{{ localized(p,'name') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="{{ 'remove' if p.id in saved_ids else 'save' }}"><input type="hidden" name="return_to" value="{{ request.full_path }}"><button class="save-piece" type="submit" aria-label="{{ t('Remove {name} from saved pieces',name=localized(p,'name')) if p.id in saved_ids else t('Save {name}',name=localized(p,'name')) }}" aria-pressed="{{ 'true' if p.id in saved_ids else 'false' }}">{{ icon('heart') }}<span class="save-label">{{ t('Saved') if p.id in saved_ids else t('Save') }}</span></button></form>{% endif %}
