{% if demo|default(false) %}<button type="button" class="save-piece" data-demo-save="{{ p.id }}" data-piece-name="{{ p.name }}" aria-label="Save {{ p.name }}" aria-pressed="false">{{ icon('heart') }}<span class="save-label">Save</span></button>{% else %}<form action="{{ url_for('save_piece',pid=p.id) }}" method="post" data-save-form data-piece-id="{{ p.id }}" data-piece-name="{{ p.name }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="{{ 'remove' if p.id in saved_ids else 'save' }}"><input type="hidden" name="return_to" value="{{ request.full_path }}"><button class="save-piece" type="submit" aria-label="{{ 'Remove' if p.id in saved_ids else 'Save' }} {{ p.name }}{{ ' from saved pieces' if p.id in saved_ids else '' }}" aria-pressed="{{ 'true' if p.id in saved_ids else 'false' }}">{{ icon('heart') }}<span class="save-label">{{ 'Saved' if p.id in saved_ids else 'Save' }}</span></button></form>{% endif %}
